# Pure static site — no build needed, works on Netlify free plan.
# Drag & drop this folder at app.netlify.com/drop, or connect the repo.

[build]
  publish = "."

# Pretty URLs: /about -> /about.html
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/service"
  to = "/service.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/appoinment"
  to = "/appoinment.html"
  status = 200

[[redirects]]
  from = "/appointment"
  to = "/appoinment.html"
  status = 200

[[redirects]]
  from = "/home.html"
  to = "/index.html"
  status = 301

# SPA-style 404 fallback off: serve the custom 404.html
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
